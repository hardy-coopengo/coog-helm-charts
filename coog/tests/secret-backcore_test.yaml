# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Test backcore secret
templates:
  - secret-backcore.yaml
release:
  name: test # Do not edit
  namespace: test
capabilities:
  majorVersion: 1
  minorVersion: 29
tests:
  - it: Test metadata & template
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: test-coog-backcore-configuration
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: coog
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: test
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - matchRegex:
          path: metadata.labels["app.kubernetes.io/version"]
          pattern: coog-.*$
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: Test variables (1/3)
    set:
      secrets:
        backCore:
          extraEnvVar:
            ENABLE_BACKCORE_SECRET: foo
          migrator:
            enabled: false
    asserts:
      - equal:
          path: stringData.TRYTOND_DATABASE__URI
          value: postgresql://:@test-postgresql:5432/test
      - equal:
          path: stringData.TRYTOND_DATABASE__API_USER
          value: ""
      - equal:
          path: stringData.TRYTOND_ASYNC__CELERY
          value: amqp://user:@test-rabbitmq:5672
      - equal:
          path: stringData.TRYTOND_ASYNC_CELERY
          value: amqp://user:@test-rabbitmq:5672
      - isNotEmpty:
          path: stringData.TRYTOND_SESSION__PASSPHRASE
      - isNotEmpty:
          path: stringData.TRYTOND_API__MAGIC_LINK_SECRET
      - equal:
          path: stringData.ENABLE_BACKCORE_SECRET
          value: foo
      - notExists:
          path: data.TRYTOND_MIGRATION__HOST
      - notExists:
          path: data.TRYTOND_MIGRATION__PASSWORD
      - notExists:
          path: data.TRYTOND_MIGRATION__USER

  - it: Test variables (2/3)
    set:
      postgresql:
        host: external-postgresql.com
        service:
          ports:
            postgresql: 5433
        auth:
          username: user0
          password: password0
          database: test0
          api_user: "api"
      rabbitmq:
        auth:
          username: user1
          password: password1
        service:
          port: 5673
      backCore:
        migrator:
          enabled: true
      secrets:
        backCore:
          extraEnvVar:
            TRYTOND_SESSION__PASSPHRASE: foo
            TRYTOND_API__MAGIC_LINK_SECRET: bar
          migrator:
            extraEnvVar:
              TRYTOND_MIGRATION__PASSWORD: ""
              TRYTOND_MIGRATION__USER: ""
    asserts:
      - equal:
          path: stringData.TRYTOND_DATABASE__URI
          value: postgresql://user0:password0@external-postgresql.com:5433/test0
      - equal:
          path: stringData.TRYTOND_ASYNC__CELERY
          value: amqp://user1:password1@test-rabbitmq:5673
      - equal:
          path: stringData.TRYTOND_ASYNC_CELERY
          value: amqp://user1:password1@test-rabbitmq:5673
      - equal:
          path: stringData.TRYTOND_SESSION__PASSPHRASE
          value: foo
      - equal:
          path: stringData.TRYTOND_API__MAGIC_LINK_SECRET
          value: bar
      - equal:
          path: stringData.TRYTOND_MIGRATION__HOST
          value: external-postgresql.com
      - equal:
          path: stringData.TRYTOND_MIGRATION__PASSWORD
          value: password0
      - equal:
          path: stringData.TRYTOND_MIGRATION__USER
          value: user0
      - equal:
          path: stringData.TRYTOND_DATABASE__API_USER
          value: "api"

  - it: Test variables (3/3)
    set:
      rabbitmq:
        isManaged: false
        auth:
          username: user1
          password: password1
        vhost: vhost
      backCore:
        migrator:
          enabled: true
      secrets:
        backCore:
          migrator:
            extraEnvVar:
              TRYTOND_MIGRATION__PASSWORD: "password1"
              TRYTOND_MIGRATION__USER: "user1"
    asserts:
      - equal:
          path: stringData.TRYTOND_MIGRATION__PASSWORD
          value: password1
      - equal:
          path: stringData.TRYTOND_MIGRATION__USER
          value: user1
      - equal:
          path: stringData.TRYTOND_ASYNC__CELERY
          value: amqp://user1:password1@test-rabbitmq:5672/vhost
      - equal:
          path: stringData.TRYTOND_ASYNC_CELERY
          value: amqp://user1:password1@test-rabbitmq:5672/vhost

  - it: AMQP URI in operator mode points to the external RabbitmqCluster Service
    set:
      rabbitmq:
        mode: operator
        isManaged: false
        auth:
          username: tenant-user
          password: tenant-pass
    asserts:
      - equal:
          path: stringData.TRYTOND_ASYNC__CELERY
          value: amqp://tenant-user:tenant-pass@rabbitmq-production.rabbitmq-system.svc.cluster.local:5672/test
      - equal:
          path: stringData.TRYTOND_ASYNC_CELERY
          value: amqp://tenant-user:tenant-pass@rabbitmq-production.rabbitmq-system.svc.cluster.local:5672/test

  - it: AMQP URI in operator mode honors custom cluster reference and vhost
    set:
      rabbitmq:
        mode: operator
        isManaged: false
        auth:
          username: tenant-user
          password: tenant-pass
        operator:
          vhost: /shared-vhost
          cluster:
            name: rabbitmq-staging
            namespace: rabbitmq-staging-ns
    asserts:
      - equal:
          path: stringData.TRYTOND_ASYNC__CELERY
          value: amqp://tenant-user:tenant-pass@rabbitmq-staging.rabbitmq-staging-ns.svc.cluster.local:5672/shared-vhost
      - equal:
          path: stringData.TRYTOND_ASYNC_CELERY
          value: amqp://tenant-user:tenant-pass@rabbitmq-staging.rabbitmq-staging-ns.svc.cluster.local:5672/shared-vhost

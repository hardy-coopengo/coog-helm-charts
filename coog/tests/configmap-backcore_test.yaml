# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Test backcore configmap
templates:
  - configmap-backcore.yaml
release:
  name: test # Do not edit
  namespace: test
capabilities:
  majorVersion: 1
  minorVersion: 29
tests:
  - it: Test metadata & template
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: test-coog-backcore-configuration
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: coog
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: test
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - matchRegex:
          path: metadata.labels["app.kubernetes.io/version"]
          pattern: coog-.*$

  - it: Test variables (1/3)
    set:
      backCore:
        extraEnvVar:
          BACKCORE_DYNAMIC_CONFIG: foo
          LOG_LEVEL: INFO
        migrator:
          enabled: true
          extraEnvVar:
            TRYTOND_MIGRATION__DATABASE: "staging"
            TRYTOND_MIGRATION__SSLMODE: "disabled"
            TRYTOND_MIGRATION__SCHEMA: "staging"
    asserts:
      - equal:
          path: data.COOG_POSTGRES_HOST
          value: test-postgresql
      - equal:
          path: data.COOG_POSTGRES_PORT
          value: "5432"
      - equal:
          path: data.COOG_DB_NAME
          value: test
      - equal:
          path: data.DB_NAME
          value: test
      - notExists:
          path: data.TRYTOND_REPORT__API
      - equal:
          path: data.TRYTOND_DATABASE_NAMES
          value: test
      - equal:
          path: data.BACKCORE_DYNAMIC_CONFIG
          value: foo
      - equal:
          path: data.LOG_LEVEL
          value: INFO
      - equal:
          path: data.TRYTOND_DOCUMENT_API__TEMPORARY_UPLOAD_ROOT
          value: /tmp/uploads/
      - equal:
          path: data.TRYTOND_MIGRATION__DATABASE
          value: staging
      - equal:
          path: data.TRYTOND_MIGRATION__SSLMODE
          value: disabled
      - equal:
          path: data.TRYTOND_MIGRATION__SCHEMA
          value: staging
      - notExists:
          path: data.TRYTOND_GATEWAY__URL

  - it: Test variables (2/3)
    set:
      postgresql:
        host: external-postgresql.com
        service:
          ports:
            postgresql: 5433
        auth:
          database: "test0"
      backCore:
        extraDatabases:
          - test1
          - test2
        migrator:
          enabled: false
      libroconv:
        enabled: true
      frontCore:
        enabled: true
    asserts:
      - equal:
          path: data.COOG_POSTGRES_HOST
          value: external-postgresql.com
      - equal:
          path: data.COOG_POSTGRES_PORT
          value: "5433"
      - equal:
          path: data.COOG_DB_NAME
          value: test0
      - equal:
          path: data.DB_NAME
          value: test0
      - equal:
          path: data.TRYTOND_DATABASE_NAMES
          value: test0,test1,test2
      - equal:
          path: data.TRYTOND_REPORT__API
          value: http://test-coog-libroconv:5000/unoconv/{oext}
      - notExists:
          path: data.TRYTOND_MIGRATION__DATABASE
      - notExists:
          path: data.TRYTOND_MIGRATION__SSLMODE
      - notExists:
          path: data.TRYTOND_MIGRATION__SCHEMA
      - equal:
          path: data.TRYTOND_GATEWAY__URL
          value: http://test-coog-gateway

  - it: Test variables (3/3)
    set:
      libroconv:
        enabled: false
        externalAddress: "test-service-externe.com"
        externalPort: 5001
    asserts:
      - equal:
          path: data.TRYTOND_REPORT__API
          value: http://test-service-externe.com:5001/unoconv/{oext}/test

  - it: Test temporary upload root is overridable
    set:
      backCore:
        extraEnvVar:
          TRYTOND_DOCUMENT_API__TEMPORARY_UPLOAD_ROOT: /workspace/io/uploads/
    asserts:
      - equal:
          path: data.TRYTOND_DOCUMENT_API__TEMPORARY_UPLOAD_ROOT
          value: /workspace/io/uploads/

  - it: Test clamav disabled by default
    asserts:
      - notExists:
          path: data.CLAMAV_HOST
      - notExists:
          path: data.CLAMAV_PORT
      - notExists:
          path: data.TRYTOND_DATABASE__BINARY_SCANNER
      - notExists:
          path: data.TRYTOND_DATABASE__BINARY_SCANNER_DIRECTORY

  - it: Test clamav variables when enabled
    set:
      clamav:
        enabled: true
        host: clamav.coog.io
        port: 443
    asserts:
      - equal:
          path: data.CLAMAV_HOST
          value: clamav.coog.io
      - equal:
          path: data.CLAMAV_PORT
          value: "443"
      - equal:
          path: data.TRYTOND_DATABASE__BINARY_SCANNER
          value: clamav_wrapper.py
      - equal:
          path: data.TRYTOND_DATABASE__BINARY_SCANNER_DIRECTORY
          value: /tmp/
